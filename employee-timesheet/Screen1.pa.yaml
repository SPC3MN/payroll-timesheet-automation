                    LayoutMinHeight: =0
                    LayoutAlignItems: =LayoutAlignItems.Stretch
                    LayoutGap: =16
                    PaddingTop: =16
                    PaddingBottom: =24
                    PaddingLeft: =16
                    PaddingRight: =16
                    Fill: =RGBA(244,246,249,1)
                Children:
                    - tsHeaderCard:
                        Control: GroupContainer
                        Variant: AutoLayout
