                            PaddingTop: =20
                            PaddingBottom: =20
                            PaddingLeft: =20
                            PaddingRight: =20
                            LayoutMinWidth: =0
                            LayoutMinHeight: =0
                            Height: =232
                            FillPortions: =0
                            AlignInContainer: =AlignInContainer.Stretch
                            Fill: =RGBA(255,255,255,1)
                            DropShadow: =DropShadow.Light
                            RadiusTopLeft: =8
                            RadiusTopRight: =8
                            RadiusBottomLeft: =8
                            RadiusBottomRight: =8
                        Children:
                            - lblEmployeeFieldLabel:
                                Control: ModernText
                                Properties:
                                    Text: ="Employee"
                                    Color: =RGBA(100,116,139,1)
                                    Size: =13
                                    FontWeight: =FontWeight.Semibold
                                    Wrap: =false
                                    AutoHeight: =false
                                    Height: =20
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AccessibleLabel: ="Employee field label"
                            - cmbEmployee:
                                Control: ModernDropdown
                                Properties:
                                    Items: =colEmployees
                                    ItemDisplayText: =ThisItem.Name
                                    Height: =52
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AccessibleLabel: ="Employee"
                            - lblPayPeriodFieldLabel:
                                Control: ModernText
                                Properties:
                                    Text: ="Pay Period Start"
                                    Color: =RGBA(100,116,139,1)
                                    Size: =13
                                    FontWeight: =FontWeight.Semibold
                                    Wrap: =false
                                    AutoHeight: =false
                                    Height: =20
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AccessibleLabel: ="Pay period start date field label"
                            - dpPayPeriodStart:
                                Control: ModernDatePicker
                                Properties:
                                    DefaultDate: =Today()
                                    Height: =52
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AccessibleLabel: ="Pay period start date"
