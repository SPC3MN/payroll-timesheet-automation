                  - lblReviewSun2:
                      Control: ModernText
                      Properties:
                        Text: =Text(dpPayPeriodStart.SelectedDate + 13, "dddd, mmmm d") & " — " & Text(txtSun2Hours.Value, "0.#") & " hrs"
                        Color: =RGBA(30,41,59,1)
