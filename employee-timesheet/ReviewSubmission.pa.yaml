                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =8
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =12
                  PaddingRight: =12
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Height: =316
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =RGBA(254,243,199,0.5)
                  DropShadow: =DropShadow.Light
