Screens:
  ReviewSubmission:
    Properties:
      OnVisible: |-
        =UpdateContext({varSubmissionConfirmed: false})
    Children:
      - revRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =16
            PaddingTop: =16
            PaddingBottom: =24
            PaddingLeft: =16
            PaddingRight: =16
            Fill: =RGBA(244,246,249,1)
          Children:
            - revPageTitle:
                Control: ModernText
                Properties:
                  Text: ="Review & Submit"
                  Color: =RGBA(30,41,63,1)
                  Size: =24
                  FontWeight: =FontWeight.Bold
                  Wrap: =false
                  AutoHeight: =false
                  Height: =36
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  AccessibleLabel: ="Review and submit page title"
            - revConfirmationBanner:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Height: =128
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =RGBA(220,252,231,1)
                  DropShadow: =DropShadow.Light
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  Visible: =varSubmissionConfirmed
                Children:
                  - lblConfirmationMessage:
                      Control: ModernText
                      Properties:
                        Text: '="Timesheet for " & cmbEmployee.Selected.Name & " submitted and saved to Excel. Confirmation #" & Left(varLastSubmission.SubmissionId, 8) & "."'
                        Color: =RGBA(21,128,61,1)
                        Size: =15
                        FontWeight: =FontWeight.Semibold
                        Wrap: =true
                        AutoHeight: =true
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        AccessibleLabel: ="Submission confirmation message"
            - revSummaryCard:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =8
                  PaddingTop: =20
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Height: =128
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =RGBA(255,255,255,1)
                  DropShadow: =DropShadow.Light
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                Children:
                  - lblReviewEmployee:
                      Control: ModernText
                      Properties:
                        Text: '="Employee: " & cmbEmployee.Selected.Name'
                        Color: =RGBA(30,41,59,1)
                        Size: =16
                        FontWeight: =FontWeight.Semibold
                        Wrap: =false
                        AutoHeight: =false
                        Height: =28
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        AccessibleLabel: ="Employee name"
                  - lblReviewPayPeriod:
                      Control: ModernText
                      Properties:
                        Text: '="Pay Period: " & Text(dpPayPeriodStart.SelectedDate,"mmmm d, yyyy") & " – " & Text(dpPayPeriodStart.SelectedDate+13,"mmmm d, yyyy")'
                        Color: =RGBA(30,41,59,1)
                        Size: =15
                        FontWeight: =FontWeight.Normal
                        Wrap: =true
                        AutoHeight: =true
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        AccessibleLabel: ="Pay period date range"
            - revWeek1Card:
