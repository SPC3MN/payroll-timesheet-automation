            - revTotalsCard:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =8
                  PaddingTop: =20
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Height: =148
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =RGBA(255,255,255,1)
                  DropShadow: =DropShadow.Light
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                Children:
                  - lblReviewWeek1Total:
                      Control: ModernText
                      Properties:
                        Text: '="Week 1 Total: " & Text(txtMon1Hours.Value + txtTue1Hours.Value + txtWed1Hours.Value + txtThu1Hours.Value + txtFri1Hours.Value + txtSat1Hours.Value + txtSun1Hours.Value, "0.0")'
                        Color: =RGBA(30,41,59,1)
                        Size: =16
                        FontWeight: =FontWeight.Normal
                        Wrap: =false
                        AutoHeight: =false
                        Height: =28
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        AccessibleLabel: ="Week 1 total hours"
                  - lblReviewWeek2Total:
                      Control: ModernText
                      Properties:
                        Text: '="Week 2 Total: " & Text(txtMon2Hours.Value + txtTue2Hours.Value + txtWed2Hours.Value + txtThu2Hours.Value + txtFri2Hours.Value + txtSat2Hours.Value + txtSun2Hours.Value, "0.0")'
                        Color: =RGBA(30,41,59,1)
                        Size: =16
                        FontWeight: =FontWeight.Normal
                        Wrap: =false
                        AutoHeight: =false
                        Height: =28
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        AccessibleLabel: ="Week 2 total hours"
                  - lblReviewTotalHours:
                      Control: ModernText
                      Properties:
                        Text: '="Total Hours: " & Text((txtMon1Hours.Value + txtTue1Hours.Value + txtWed1Hours.Value + txtThu1Hours.Value + txtFri1Hours.Value + txtSat1Hours.Value + txtSun1Hours.Value) + (txtMon2Hours.Value + txtTue2Hours.Value + txtWed2Hours.Value + txtThu2Hours.Value + txtFri2Hours.Value + txtSat2Hours.Value + txtSun2Hours.Value), "0.0")'
                        Color: =RGBA(30,41,59,1)
                        Size: =20
                        FontWeight: =FontWeight.Bold
                        Wrap: =false
                        AutoHeight: =false
                        Height: =36
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        AccessibleLabel: ="Total hours for the pay period"
            - revCommentsCard:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =8
                  PaddingTop: =20
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Height: =128
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =RGBA(255,255,255,1)
                  DropShadow: =DropShadow.Light
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                Children:
                  - lblReviewCommentsCaption:
                      Control: ModernText
                      Properties:
                        Text: ="Comments / Notes"
                        Color: =RGBA(100,116,139,1)
                        Size: =13
                        FontWeight: =FontWeight.Semibold
                        Wrap: =false
                        AutoHeight: =false
                        Height: =20
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        AccessibleLabel: ="Comments and notes label"
                  - lblReviewCommentsValue:
                      Control: ModernText
                      Properties:
                        Text: =If(IsBlank(Trim(txtCommentsNotes.Text)), "(No comments entered)", txtCommentsNotes.Text)
                        Color: =RGBA(30,41,59,1)
                        Size: =15
                        FontWeight: =FontWeight.Normal
                        Wrap: =true
                        AutoHeight: =true
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        AccessibleLabel: ="Comments or notes value"
            - revButtonRow:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =12
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Height: =52
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                Children:
                  - btnEdit:
                      Control: ModernButton
                      Properties:
                        Text: ="Edit"
                        Appearance: =ButtonAppearance.Secondary
                        Color: =RGBA(30,41,63,1)
                        Size: =16
                        Height: =52
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        AccessibleLabel: ="Edit timesheet"
                        OnSelect: =Navigate(Screen1, ScreenTransition.None)
                  - btnSubmit:
                      Control: ModernButton
                      Properties:
                        Text: ="Submit"
                        Appearance: =ButtonAppearance.Primary
                        BasePaletteColor: =RGBA(30,41,63,1)
                        Color: =RGBA(255,255,255,1)
                        Size: =16
                        Height: =52
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        AccessibleLabel: ="Submit timesheet"
                        OnSelect: |-
                          =UpdateContext(
                            {
                              varLastSubmission: Patch(
                                TimesheetSubmissions,
                                Defaults(TimesheetSubmissions),
                                {
                                  SubmissionId: Text(GUID()),
                                  Employee: cmbEmployee.Selected.Name,
                                  PayPeriodStart: dpPayPeriodStart.SelectedDate,
                                  PayPeriodEnd: dpPayPeriodStart.SelectedDate + 13,
                                  Mon1Hours: Text(txtMon1Hours.Value, "0.0"),
                                  Tue1Hours: Text(txtTue1Hours.Value, "0.0"),
                                  Wed1Hours: Text(txtWed1Hours.Value, "0.0"),
                                  Thu1Hours: Text(txtThu1Hours.Value, "0.0"),
                                  Fri1Hours: Text(txtFri1Hours.Value, "0.0"),
                                  Sat1Hours: Text(txtSat1Hours.Value, "0.0"),
                                  Sun1Hours: Text(txtSun1Hours.Value, "0.0"),
                                  Mon2Hours: Text(txtMon2Hours.Value, "0.0"),
                                  Tue2Hours: Text(txtTue2Hours.Value, "0.0"),
                                  Wed2Hours: Text(txtWed2Hours.Value, "0.0"),
                                  Thu2Hours: Text(txtThu2Hours.Value, "0.0"),
                                  Fri2Hours: Text(txtFri2Hours.Value, "0.0"),
                                  Sat2Hours: Text(txtSat2Hours.Value, "0.0"),
                                  Sun2Hours: Text(txtSun2Hours.Value, "0.0"),
                                  Week1Total: Text(txtMon1Hours.Value + txtTue1Hours.Value + txtWed1Hours.Value + txtThu1Hours.Value + txtFri1Hours.Value + txtSat1Hours.Value + txtSun1Hours.Value, "0.0"),
                                  Week2Total: Text(txtMon2Hours.Value + txtTue2Hours.Value + txtWed2Hours.Value + txtThu2Hours.Value + txtFri2Hours.Value + txtSat2Hours.Value + txtSun2Hours.Value, "0.0"),
                                  TotalHours: Text((txtMon1Hours.Value + txtTue1Hours.Value + txtWed1Hours.Value + txtThu1Hours.Value + txtFri1Hours.Value + txtSat1Hours.Value + txtSun1Hours.Value) + (txtMon2Hours.Value + txtTue2Hours.Value + txtWed2Hours.Value + txtThu2Hours.Value + txtFri2Hours.Value + txtSat2Hours.Value + txtSun2Hours.Value), "0.0"),
                                  Comments: txtCommentsNotes.Text,
                                  SubmittedDate: Now()
                                }
                              )
                            }
                          );
                          UpdateContext({varSubmissionConfirmed: true});
                          Notify("Timesheet submitted and saved to Excel.", NotificationType.Success)
